name: Metrics
on:
  schedule: [{ cron: "0 */6 * * *" }]
  workflow_dispatch:
  push: { branches: ["master", "main"] }
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The activity plugin crashes since the Events API dropped commits and pull request details from its payloads,
      # so run metrics from a pinned checkout with .github/activity.patch applied on top of the official prebuilt image
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lowlighter/metrics
          ref: 366f8b9dfe3a59656c67d5dcad9950f59c9bc96d
          path: .metrics
      - run: |
          git -C .metrics apply ../.github/activity.patch
          printf 'FROM ghcr.io/lowlighter/metrics@sha256:0a24a23b769873639e7d7d3bebce0aade41ded920f8bfd74650328f4c4967b48\nCOPY source/plugins/activity/index.mjs /metrics/source/plugins/activity/index.mjs\n' > .metrics/Dockerfile
      - name: General
        if: ${{ success() || failure() }}
        uses: ./.metrics
        with:
          filename: general-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          # Template
          user: ashl3ycodes
          template: classic
          base: header, activity, repositories
          config_order: base.header, base.activity+community, activity, base.repositories, wakatime, languages
          config_padding: 0, 200
          config_timezone: America/Mexico_City
          # Recent Activity Plugin
          plugin_activity: yes
          plugin_activity_days: 7
          plugin_activity_filter: all
          plugin_activity_limit: 3
          plugin_activity_load: 300
          plugin_activity_visibility: all
          # Wakatime Plugin
          plugin_wakatime: yes
          plugin_wakatime_days: 7
          plugin_wakatime_languages_other: yes
          plugin_wakatime_limit: 3
          plugin_wakatime_repositories_visibility: all
          plugin_wakatime_sections: time, projects, projects-graphs, languages, languages-graphs, editors, os
          plugin_wakatime_url: https://wakatime.com
          plugin_wakatime_user: current
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
          # Languages Plugin
          plugin_languages: yes
          plugin_languages_limit: 4
          plugin_languages_other: true
          plugin_languages_sections: most-used
          plugin_languages_details: lines, bytes-size
          plugin_languages_indepth: true
          plugin_languages_categories: data, markup, programming
          plugin_languages_recent_categories: data, markup, programming
          plugin_languages_recent_days: 7
